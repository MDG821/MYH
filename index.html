<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI实时交互：手势探照灯 | 精准识别左右手 + 光圈羽化效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060c);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, monospace;
            padding: 20px;
        }

        .container {
            position: relative;
            border-radius: 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: none;
            vertical-align: middle;
        }

        /* 控制面板 */
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 500;
            color: #f0f3fa;
            border: 1px solid rgba(255, 200, 100, 0.4);
            z-index: 20;
            pointer-events: none;
            font-family: monospace;
        }

        .hand-status {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 16px;
            border-radius: 40px;
        }

        .hand-badge {
            background: #1e2a3a;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #4cff9e;
            border-radius: 50%;
            box-shadow: 0 0 8px #4cff9e;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        .instruction {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 32px;
            font-size: 12px;
            color: #ffecb3;
            pointer-events: none;
            z-index: 20;
            font-family: monospace;
            border-left: 4px solid #ffaa44;
        }

        /* 上传工具栏 */
        .upload-toolbar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 25;
            pointer-events: auto;
        }

        .upload-btn {
            background: rgba(20, 30, 45, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 200, 100, 0.7);
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            color: #fff3e0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: #2a3a50;
            transform: scale(1.02);
        }

        .reset-btn {
            background: rgba(80, 50, 50, 0.9);
            border-color: #ff8866;
        }

        .hidden-input {
            display: none;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: #03060c;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: opacity 0.4s;
            color: white;
            gap: 20px;
            font-family: monospace;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 3px solid rgba(100, 180, 250, 0.3);
            border-top-color: #ffaa66;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 700px) {
            .info-panel { font-size: 10px; padding: 8px 12px; }
            .upload-btn { padding: 5px 12px; font-size: 10px; }
        }
    </style>
</head>
<body>
<div class="container">
    <canvas id="mainCanvas" width="1280" height="720"></canvas>

    <div class="upload-toolbar">
        <button class="upload-btn" id="uploadBgBtn">🖼️ 上传底图 (光圈外)</button>
        <button class="upload-btn" id="uploadMaskBtn">✨ 上传蒙版 (光圈内)</button>
        <button class="upload-btn reset-btn" id="resetDefaultBtn">⟳ 恢复默认</button>
    </div>

    <div class="info-panel">
        <div class="hand-status">
            <span class="pulse-dot"></span>
            <span>✋ 实时手势</span>
            <div class="hand-badge" id="handSideLabel">
                <span>🖐️ 等待检测</span>
            </div>
        </div>
        <div style="display: flex; gap: 12px;">
            <span>🔦 光圈内 = 蒙版层</span>
            <span>🌍 光圈外 = 底图层</span>
            <span>✨ 羽化边缘</span>
        </div>
    </div>
    <div class="instruction">
        🎥 摄像头已就绪 — 举起左手或右手 → 光圈跟随手掌中心移动<br>
        ✨ 手部识别 + 左右手标签 + 动态光圈 | 可上传图片替换图层 (无骨骼线)
    </div>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div>🤖 正在加载 MediaPipe Hands 手势模型</div>
        <div style="font-size:13px;">请允许摄像头权限，稍后即可看到手势跟随的探照灯效果</div>
    </div>
</div>

<input type="file" id="bgFileInput" class="hidden-input" accept="image/jpeg,image/png,image/webp">
<input type="file" id="maskFileInput" class="hidden-input" accept="image/jpeg,image/png,image/webp">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
    (function(){
        // ======================= 配置参数 =======================
        const CONFIG = {
            SPOT_RADIUS: 160,          // 光圈半径(px)
            FEATHER_WIDTH: 32,         // 羽化宽度(px) 边缘柔和
            SMOOTHING: 0.35,           // 中心点平滑系数
            HIDE_SPOTLIGHT_WHEN_NO_HAND: true,
        };

        // DOM 元素
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const handSideSpan = document.getElementById('handSideLabel');
        const loadingDiv = document.getElementById('loadingOverlay');

        // 离屏图层
        let bgCanvas = null;     // 底图层 (静态)
        let fgCanvas = null;     // 前景蒙版层 (动态应用光圈)

        // 自定义图片相关
        let customBgImage = null;
        let customMaskImage = null;
        let currentBgUrl = null;
        let currentMaskUrl = null;

        // 手势数据
        let detectedHandLandmarks = null;   // 21个关键点 (归一化) - 仅用于计算中心和左右手标签，不绘制骨骼
        let handedness = null;              // 'Left' 或 'Right'
        let hasHand = false;
        let smoothCenter = { x: -1, y: -1 };   // 光圈中心 (画布坐标)

        // MediaPipe 对象
        let hands = null;
        let camera = null;
        let videoElement = null;
        
        // 画布尺寸 (固定1280x720, 保证映射准确)
        const CANVAS_W = 1280;
        const CANVAS_H = 720;
        canvas.width = CANVAS_W;
        canvas.height = CANVAS_H;

        // ======================= 1. 绘制默认底图 & 蒙版图 (精美风格) =======================
        function drawDefaultBackground(ctxTarget, w, h) {
            const grad = ctxTarget.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#0a1428');
            grad.addColorStop(0.5, '#10253b');
            grad.addColorStop(1, '#07101e');
            ctxTarget.fillStyle = grad;
            ctxTarget.fillRect(0, 0, w, h);
            // 星云粒子
            for(let i=0;i<500;i++) {
                const x = (i*131)%w, y = (i*253)%h;
                ctxTarget.beginPath();
                ctxTarget.arc(x, y, 1+(i%3), 0, Math.PI*2);
                ctxTarget.fillStyle = `rgba(210, 230, 255, ${0.15+Math.sin(i)*0.1})`;
                ctxTarget.fill();
            }
            // 科技网格
            ctxTarget.strokeStyle = 'rgba(80, 160, 255, 0.2)';
            ctxTarget.lineWidth = 1;
            for(let i=0; i<18; i++) {
                ctxTarget.beginPath();
                ctxTarget.moveTo(i*80, 0);
                ctxTarget.lineTo(i*80, h);
                ctxTarget.stroke();
                ctxTarget.beginPath();
                ctxTarget.moveTo(0, i*60);
                ctxTarget.lineTo(w, i*60);
                ctxTarget.stroke();
            }
            ctxTarget.font = `bold ${Math.floor(w*0.045)}px monospace`;
            ctxTarget.fillStyle = 'rgba(255,245,200,0.25)';
            ctxTarget.fillText("✦ BACKGROUND LAYER ✦", w*0.1, h*0.88);
        }

        function drawDefaultMask(ctxTarget, w, h) {
            const grad1 = ctxTarget.createLinearGradient(0, 0, w, h);
            grad1.addColorStop(0, '#ff3a6f');
            grad1.addColorStop(0.4, '#ffaa44');
            grad1.addColorStop(0.8, '#44ffaa');
            grad1.addColorStop(1, '#33ccff');
            ctxTarget.fillStyle = grad1;
            ctxTarget.fillRect(0, 0, w, h);
            // 炫光波点
            for(let i=0;i<200;i++) {
                ctxTarget.beginPath();
                ctxTarget.arc( (i*173)%w, (i*271)%h, 5+(i%8), 0, Math.PI*2);
                ctxTarget.fillStyle = `rgba(255,255,200,${0.2+Math.sin(i)*0.1})`;
                ctxTarget.fill();
            }
            ctxTarget.font = `bold ${Math.floor(w*0.15)}px "Segoe UI"`;
            ctxTarget.fillStyle = 'rgba(0,0,0,0.25)';
            ctxTarget.fillText("🎭", w*0.3, h*0.7);
            ctxTarget.fillStyle = 'rgba(255,255,255,0.9)';
            ctxTarget.font = `bold ${Math.floor(w*0.055)}px monospace`;
            ctxTarget.fillText("MASK LAYER", w*0.6, h*0.85);
            ctxTarget.font = `24px monospace`;
            ctxTarget.fillStyle = 'white';
            ctxTarget.fillText("◈ 光圈内显示此层 ◈", w*0.1, h*0.2);
        }

        function drawBackgroundImage(ctxTarget, w, h) {
            if(customBgImage && customBgImage.complete && customBgImage.naturalWidth>0) {
                ctxTarget.drawImage(customBgImage, 0, 0, w, h);
            } else {
                drawDefaultBackground(ctxTarget, w, h);
            }
        }

        function drawMaskImage(ctxTarget, w, h) {
            if(customMaskImage && customMaskImage.complete && customMaskImage.naturalWidth>0) {
                ctxTarget.drawImage(customMaskImage, 0, 0, w, h);
            } else {
                drawDefaultMask(ctxTarget, w, h);
            }
        }

        function redrawBackgroundLayer() {
            if(!bgCanvas) return;
            const bgCtx = bgCanvas.getContext('2d');
            drawBackgroundImage(bgCtx, CANVAS_W, CANVAS_H);
        }

        function redrawFullMaskLayer() {
            if(!fgCanvas) return;
            const fgCtx = fgCanvas.getContext('2d');
            drawMaskImage(fgCtx, CANVAS_W, CANVAS_H);
        }

        // ======================= 2. 光圈羽化核心逻辑 =======================
        function applySpotlightMask(centerX, centerY, radius, feather) {
            if(!fgCanvas) return;
            const fgCtx = fgCanvas.getContext('2d');
            // 确保当前fgCanvas里有完整的蒙版图像
            // 使用 'destination-in' 仅保留圆圈内部内容，外部透明
            fgCtx.globalCompositeOperation = 'destination-in';
            const innerR = Math.max(0, radius - feather);
            const gradient = fgCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            const innerStop = Math.min(0.98, innerR/radius);
            gradient.addColorStop(innerStop, 'rgba(255,255,255,1)');
            gradient.addColorStop(innerStop + 0.08, 'rgba(255,255,255,0.7)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            fgCtx.beginPath();
            fgCtx.arc(centerX, centerY, radius, 0, Math.PI*2);
            fgCtx.fillStyle = gradient;
            fgCtx.fill();
            fgCtx.globalCompositeOperation = 'source-over';
        }

        // 更新前景: 重绘完整蒙版图 → 应用光圈 (仅当有手)
        function updateForegroundWithHand() {
            if(!fgCanvas) return;
            redrawFullMaskLayer();   // 先画出完整蒙版图
            if(hasHand && smoothCenter.x > 0 && smoothCenter.y > 0) {
                applySpotlightMask(smoothCenter.x, smoothCenter.y, CONFIG.SPOT_RADIUS, CONFIG.FEATHER_WIDTH);
            } else {
                // 无手势完全透明 (露出底图)
                const fgCtx = fgCanvas.getContext('2d');
                fgCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            }
        }

        // ======================= 3. 渲染主画面 (底图+前景+手势辅助视觉，无骨骼关节) =======================
        function renderMainFrame() {
            if(!bgCanvas || !fgCanvas) return;
            ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
            // 绘制底图
            ctx.drawImage(bgCanvas, 0, 0, CANVAS_W, CANVAS_H);
            // 绘制前景 (已包含光圈)
            ctx.drawImage(fgCanvas, 0, 0, CANVAS_W, CANVAS_H);
            
            // ----- 仅保留手势辅助视觉：左右手标签 + 光圈高亮轮廓，彻底去除骨骼线条和关节点 -----
            if(hasHand && detectedHandLandmarks && smoothCenter.x > 0 && smoothCenter.y > 0) {
                ctx.save();
                ctx.shadowBlur = 0;
                // 1. 绘制辅助圆圈 (强调光圈边界) - 保持原有探照灯视觉反馈
                ctx.beginPath();
                ctx.arc(smoothCenter.x, smoothCenter.y, CONFIG.SPOT_RADIUS + 3, 0, Math.PI*2);
                ctx.strokeStyle = '#ffcc88';
                ctx.lineWidth = 2.5;
                ctx.setLineDash([8, 10]);
                ctx.stroke();
                ctx.setLineDash([]);
                // 2. 中心亮点 (凸显手掌位置)
                ctx.beginPath();
                ctx.arc(smoothCenter.x, smoothCenter.y, 8, 0, Math.PI*2);
                ctx.fillStyle = '#ffdd99';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(smoothCenter.x, smoothCenter.y, 3, 0, Math.PI*2);
                ctx.fillStyle = 'white';
                ctx.fill();
                
                // 3. 绘制左右手标签文字 (位于手腕上方) — 保留，提供左右手识别反馈
                const wrist = detectedHandLandmarks[0];
                if(wrist) {
                    const labelX = wrist.x * CANVAS_W;
                    const labelY = (wrist.y * CANVAS_H) - 35;
                    ctx.font = "bold 24px 'Segoe UI', monospace";
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = '#fff3c9';
                    ctx.shadowColor = "#000000aa";
                    const handText = handedness === 'Left' ? '👈 左手' : (handedness === 'Right' ? '👉 右手' : '✋ 手掌');
                    ctx.fillText(handText, labelX - 30, labelY);
                }
                ctx.restore();
            } else if(!hasHand) {
                // 无手部时显示引导提示 (保留原有交互提示)
                ctx.font = "18px monospace";
                ctx.fillStyle = "rgba(255,240,180,0.9)";
                ctx.shadowBlur = 0;
                ctx.fillText("👆 未检测到手部 — 请将手掌完全展现在摄像头前", 40, 80);
            }
            // 注意：原有的手部骨架绘制 (连接线 + 21个关节点) 已完全移除，不改变任何其他功能。
        }

        // ======================= 4. 手势识别 & 中心点平滑 (保留识别，只用于光圈与标签，不用于绘制骨架) =======================
        function computeHandCenter(landmarks) {
            if(!landmarks || landmarks.length < 21) return null;
            const wrist = landmarks[0];
            const middleBase = landmarks[12];
            const cx = (wrist.x + middleBase.x) / 2;
            const cy = (wrist.y + middleBase.y) / 2;
            return { x: cx * CANVAS_W, y: cy * CANVAS_H };
        }

        // MediaPipe 回调 (核心：手势识别并更新光圈位置，但不绘制骨骼)
        function onHandResults(results) {
            if(results && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const handLandmarks = results.multiHandLandmarks[0];
                const handInfo = results.multiHandedness?.[0];
                const newHandedness = handInfo ? handInfo.label : 'Unknown';
                detectedHandLandmarks = handLandmarks;
                handedness = newHandedness;
                hasHand = true;
                // 更新界面UI
                if(handedness === 'Left') handSideSpan.innerHTML = '👈 左手 (光圈跟随)';
                else if(handedness === 'Right') handSideSpan.innerHTML = '👉 右手 (光圈跟随)';
                else handSideSpan.innerHTML = '🖐️ 手掌已识别';
                
                const rawCenter = computeHandCenter(handLandmarks);
                if(rawCenter) {
                    if(smoothCenter.x === -1) {
                        smoothCenter = rawCenter;
                    } else {
                        smoothCenter.x = smoothCenter.x * (1 - CONFIG.SMOOTHING) + rawCenter.x * CONFIG.SMOOTHING;
                        smoothCenter.y = smoothCenter.y * (1 - CONFIG.SMOOTHING) + rawCenter.y * CONFIG.SMOOTHING;
                    }
                }
            } else {
                // 无手部
                if(hasHand) {
                    hasHand = false;
                    detectedHandLandmarks = null;
                    handedness = null;
                    handSideSpan.innerHTML = '✋ 未检测到手掌';
                    smoothCenter = { x: -1, y: -1 };
                }
            }
            
            // 刷新前景图层 (蒙版+光圈)
            updateForegroundWithHand();
            // 渲染最终画面 (无骨骼点)
            renderMainFrame();
        }

        // ======================= 5. 图片上传与重置 (功能完全保留) =======================
        function uploadImage(type, file) {
            if(!file) return;
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => {
                if(type === 'bg') {
                    if(currentBgUrl) URL.revokeObjectURL(currentBgUrl);
                    customBgImage = img;
                    currentBgUrl = url;
                    redrawBackgroundLayer();
                } else if(type === 'mask') {
                    if(currentMaskUrl) URL.revokeObjectURL(currentMaskUrl);
                    customMaskImage = img;
                    currentMaskUrl = url;
                    // 立即刷新前景并重新应用光圈
                    updateForegroundWithHand();
                }
                renderMainFrame();
            };
            img.onerror = () => {
                console.warn("图片加载失败");
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        function resetToDefault() {
            if(currentBgUrl) { URL.revokeObjectURL(currentBgUrl); currentBgUrl = null; }
            if(currentMaskUrl) { URL.revokeObjectURL(currentMaskUrl); currentMaskUrl = null; }
            customBgImage = null;
            customMaskImage = null;
            redrawBackgroundLayer();
            updateForegroundWithHand();
            renderMainFrame();
        }

        // ======================= 6. 初始化图层 & MediaPipe =======================
        function initLayers() {
            bgCanvas = document.createElement('canvas');
            fgCanvas = document.createElement('canvas');
            bgCanvas.width = CANVAS_W;
            bgCanvas.height = CANVAS_H;
            fgCanvas.width = CANVAS_W;
            fgCanvas.height = CANVAS_H;
            redrawBackgroundLayer();
            redrawFullMaskLayer();
        }

        async function initMediaPipe() {
            hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,          // 只追踪一只手 (主手, 光圈唯一)
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            hands.onResults(onHandResults);
            
            const video = document.createElement('video');
            videoElement = video;
            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: CANVAS_W,
                height: CANVAS_H
            });
            await camera.start();
            
            // 隐藏加载遮罩
            if(loadingDiv) {
                loadingDiv.style.opacity = '0';
                setTimeout(() => { loadingDiv.style.display = 'none'; }, 500);
            }
            
            initLayers();
            renderMainFrame();
            
            // 响应窗口大小变化 (仅调整CSS显示尺寸)
            const setCanvasDisplaySize = () => {
                const container = document.querySelector('.container');
                const maxWidth = Math.min(window.innerWidth - 40, 1400);
                const aspect = CANVAS_W/CANVAS_H;
                let displayWidth = maxWidth;
                let displayHeight = displayWidth / aspect;
                if(displayHeight > window.innerHeight - 80) {
                    displayHeight = window.innerHeight - 80;
                    displayWidth = displayHeight * aspect;
                }
                canvas.style.width = `${displayWidth}px`;
                canvas.style.height = `${displayHeight}px`;
            };
            setCanvasDisplaySize();
            window.addEventListener('resize', setCanvasDisplaySize);
        }

        // ======================= 7. 绑定UI事件 =======================
        document.getElementById('uploadBgBtn').addEventListener('click', () => document.getElementById('bgFileInput').click());
        document.getElementById('uploadMaskBtn').addEventListener('click', () => document.getElementById('maskFileInput').click());
        document.getElementById('resetDefaultBtn').addEventListener('click', resetToDefault);
        document.getElementById('bgFileInput').addEventListener('change', (e) => {
            if(e.target.files && e.target.files[0]) uploadImage('bg', e.target.files[0]);
            e.target.value = '';
        });
        document.getElementById('maskFileInput').addEventListener('change', (e) => {
            if(e.target.files && e.target.files[0]) uploadImage('mask', e.target.files[0]);
            e.target.value = '';
        });

        // 启动
        window.onload = () => {
            initMediaPipe().catch(err => {
                console.error(err);
                if(loadingDiv) {
                    loadingDiv.innerHTML = `<div style="text-align:center; padding:20px;">❌ 启动失败: ${err.message}<br>请确保使用 HTTPS 或 localhost 访问，并允许摄像头权限</div>`;
                }
            });
        };
    })();
</script>
</body>
</html>
